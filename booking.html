<!-- internal javascript -->
 creating a landing page
   <script>
    // 1. Get the department from the URL (the ?dept= part)
    const params = new URLSearchParams(window.location.search);
    const department = params.get('dept');

    // 2. Identify the "Target" elements on the page
    const titleArea = document.getElementById('dept-title');
    const imageArea = document.getElementById('image-landing');
    // targeting the div to show the real ticket no on time
    const ticketMessage=document.querySelector('.number')
    // 3. CALENDAR ARRAY (As requested)
    const weekDays = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];

    // 3. The Logic: If the URL says 'xray', change the title and image
    if (department === 'xray') {
        titleArea.innerText = "Radiology & X-Ray Unit";
        imageArea.innerHTML = '<img src="xray.jpg" class="dept-img">';
    } 
    else if (department === 'dental') {
        titleArea.innerText = "Dental Care Wing";
        imageArea.innerHTML = '<img src="dental.jpg" class="dept-img">';
    } 
    else if (department === 'mri') {
        titleArea.innerText = "MRI Scanning Suite";
        imageArea.innerHTML = '<img src="mri.jpg" class="dept-img">';
    }
    else {
        // If someone goes to booking.html without picking a department
        titleArea.innerText = "Please Select a Department";
    }
</script>
