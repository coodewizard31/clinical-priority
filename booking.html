                <p>Waiting for selection...</p>

<!-- internal javascript -->
 creating a landing page
    <script>
        const params = new URLSearchParams(window.location.search);
        const dept = params.get('dept');
        const landing = document.getElementById('image-landing');
        const title = document.getElementById('dept-title');

        if (dept === 'xray') {
            title.innerText = "Radiology & X-Ray Unit";
            landing.innerHTML = '<img src="xray.jpg" class="dept-img" alt="X-Ray">';
        } else if (dept === 'dental') {
            title.innerText = "Dental Care Wing";
            landing.innerHTML = '<img src="dental.jpg" class="dept-img" alt="Dental">';
        } else if (dept === 'mri') {
            title.innerText = "MRI Scanning Suite";
            landing.innerHTML = '<img src="mri.jpg" class="dept-img" alt="MRI">';
        }
    </script>
</body>
</html>
